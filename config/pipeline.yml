# config/pipeline.yml: the one place the India entry-level filters live.
#
# Every scanner reads this file: scan-freehire, scan-internshala, scan-jobspy,
# scan.mjs (portals), scan-ats-full. When this file exists, its title_filter
# REPLACES the title_filter (and title_filter_full) in portals.yml.
#
# Matching (see title-keywords.mjs):
#   plain      substring, so "engineer" also matches "Engineering"
#   word:x     the whole word only: word:sales does not hit "Salesforce"
#   stem:x     a word that STARTS with x: stem:senior hits "Seniors", not "Reseniority"
# Short all-letter keywords (2-3 letters) are always whole-word.
# Titles are lowercased and accent-folded first.

title_filter:
  positive:
    - software
    - sde
    - sdet
    - developer
    - engineer
    - programmer
    - word:backend
    - back end
    - back-end
    - word:frontend
    - front end
    - front-end
    - full stack
    - full-stack
    - fullstack
    - devops
    - word:sre
    - word:cloud
    - word:platform
    - word:ai
    - word:ml
    - machine learning
    - data scientist
    - data science
    - mobile
    - android
    - word:ios
    - react
    - node
    - java
    - python
    - golang
    - word:qa
    - quality assurance
    - technical staff
    - word:mts
    - trainee
    - associate
    - fresher
    - entry level
    - early career
    - new grad
    - campus hire
    - graduate engineer
    - word:intern
    - word:interns
    - stem:internship

  negative:
    # Levels above entry. Numerals are whole-word so "Engineer 2027" is not "Engineer 2".
    - word:senior
    - word:sr
    - word:ii
    - word:iii
    - word:iv
    - word:engineer 2
    - word:engineer 3
    - word:engineer 4
    - word:developer 2
    - word:developer 3
    - word:developer 4
    - word:sde 2
    - word:sde-2
    - word:sde2
    - word:sde 3
    - word:sde-3
    - word:sde3
    - word:sde 4
    - word:lead
    - word:principal
    - stem:staff
    - word:head
    - stem:director
    - word:manager
    - word:vp
    - word:intermediate
    - word:architect
    - stem:consultant
    - stem:specialist
    # Other functions. "sales" does not reach "Salesforce"; "trainer" does not reach "trainee".
    - word:sales
    - stem:marketing
    - business development
    - word:hr
    - human resource
    - stem:recruit
    - content writer
    - word:writer
    - word:graphic
    - word:seo
    - telecaller
    - word:customer
    - accountant
    - word:finance
    - stem:teach
    - stem:trainer
    - civil
    - mechanical
    - electrical engineer
    - data entry
    - back office
    - backend executive
    - back end executive
    - back-end executive
    - support executive
    - non-voice
    - word:bpo
    - word:tender
    - word:process
    - service desk
    - word:facility
    - business analyst
    - data analyst
    - financial analyst
    - word:documentation
    - fellowship
    # Not a fit: part time, volunteer, walk-in, unrelated stacks and hardware.
    - stem:volunteer
    - stem:freelance
    - part time
    - part-time
    - walk-in
    - html/css
    - wordpress
    - word:sap
    - word:abap
    - servicenow
    - oracle ebs
    - mainframe
    - cobol
    - word:embedded
    - firmware
    - fpga
    - asic
    - stem:blockchain
    - word:web3
    - stem:crypto
    - salesforce admin

  # Phrases that must survive the negatives above ("technical staff" is not "staff").
  protect:
    - member of technical staff

# Graduation batches you accept. A posting that names a batch year next to
# batch / passout / graduates must name one of these; postings naming no year stay.
batch_years: [2027]

# Only recent jobs are kept (tools/freshness.py, applied to every row whichever scanner found it).
#   max_age_days       a board or aggregator posting dated older than this is dropped as stale
#   employer_max_age_days  the same for company career pages and ATS boards, which hire over long windows (a July posting can
#                      still be open): a soft limit, and an undated employer posting is kept
#   undated_ok_steps   scan steps whose query already limits the age (their window / hours_old), so an undated row is trusted
#   undated_ok_sources feeds that list the newest jobs first but carry no dates (instahyre)
# Any other undated row is dropped: its age cannot be checked.
freshness:
  max_age_days: 7
  employer_max_age_days: 180
  undated_ok_steps: [freehire, internshala, jobspy, jobspy-slow]
  undated_ok_sources: [instahyre]

# Naukri-style experience ranges ("0-2 Yrs"): keep when the MINIMUM is at most this.
max_min_experience_years: 0

# ATS boards carry no experience field, so the description is read for phrases like
# "3+ years of experience". Applies where a description is available.
#   flag_min_years  keep the posting but add a flag when the stated minimum is >= this
#   drop_min_years  drop it when the stated minimum is >= this (null = never drop)
# A description that says "freshers welcome" is never flagged or dropped.
seniority_guard:
  enabled: true
  flag_min_years: 2
  drop_min_years: 3

# Borderline cases are kept and marked rather than dropped silently.
#   unpaid: flag keeps unpaid Internshala internships marked [unpaid]; drop removes them.
borderline:
  unpaid: flag

# Rejected rows are logged (title, company, source, url, reason) and kept this long.
rejected_log_days: 30

# ---- Phase 3: cross-source dedup (tools/canonical.py, tools/dedup.py) ----
dedup: {"tracking_params": ["utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content", "gclid", "fbclid", "msclkid", "ref", "referrer", "refid", "trk", "trackingid", "tracking_id", "src", "source", "lever-source", "lever-origin", "gh_src", "ccuid", "vjs", "from", "campaign", "sid", "ebp", "ebp_src", "eml", "cid", "mc_cid", "mc_eid", "_ga", "_gl"], "company_suffixes": ["pvt", "private", "ltd", "limited", "inc", "incorporated", "llc", "llp", "corp", "corporation", "co", "company", "gmbh", "plc", "pte", "india", "opc", "technologies", "technology", "tech", "solutions", "software", "systems", "labs", "services", "softwares"], "title_noise": ["urgent", "hiring", "opening", "openings", "immediate", "joiner", "joiners", "fresher", "freshers", "wanted", "required", "remote", "hybrid", "onsite", "wfo", "wfh"], "city_aliases": {"bangalore": "bengaluru", "bengaluru": "bengaluru", "gurgaon": "gurugram", "gurugram": "gurugram", "bombay": "mumbai", "navi mumbai": "mumbai", "madras": "chennai", "calcutta": "kolkata", "new delhi": "delhi", "noida": "noida", "greater noida": "noida"}, "generic_locations": ["india", "remote", "anywhere", "work from home", "wfh", "pan india", "multiple locations", "hybrid", "onsite"], "employer_hosts": ["greenhouse.io", "lever.co", "ashbyhq.com", "myworkdayjobs.com", "smartrecruiters.com", "icims.com", "bamboohr.com", "paylocity.com", "workable.com", "recruitee.com", "jobvite.com", "teamtailor.com", "breezy.hr", "keka.com", "zohorecruit.com", "zohorecruit.in", "darwinbox.in", "freshteam.com", "eightfold.ai"], "aggregator_hosts": ["linkedin.com", "naukri.com", "indeed.com", "internshala.com", "glassdoor.com", "foundit.in", "monster.com", "shine.com", "wellfound.com", "angel.co", "instahyre.com", "cutshort.io", "ziprecruiter.com", "simplyhired.com", "jooble.org", "adzuna.in", "unstop.com", "freshersworld.com", "apna.co", "hirist.tech", "freshershunt.in", "freshersdunia.in", "offcampusjobs4u.com", "freshersnow.com", "fresheropenings.com", "freshersarea.in", "remoteok.com", "remotive.com", "ycombinator.com", "iimjobs.com", "t.me", "telegram.me"], "similar_title_overlap": 0.6}

# ---- Phase 5: health, windows ----
# A source is DEGRADED when a run fetches under degraded_ratio of its median over the last history_runs
# successful runs (needs min_history runs first), and DEAD when it fetches nothing.
health:
  history_runs: 14
  degraded_ratio: 0.4
  min_history: 3

# Fetch "since last success minus overlap_days" instead of a fixed --days. --days on the command line overrides.
window:
  overlap_days: 1
  default_days: 3
  max_days: 14

# ---- Phase 6: JobSpy (LinkedIn guest search etc.) ----
# All terms stay available. Each site's budget caps scrape calls per run (retries count) so a long term list cannot hammer
# one site; terms rotate so the ones skipped today go first next time. The sites table is the one place a JobSpy site is
# described: first_pass sites run in a default mine.py run, slow sites run only in the slow lane (they rate-limit).
jobspy:
  terms: ["software engineer fresher", "software developer fresher", "sde 1", "associate software engineer", "graduate engineer trainee", "backend developer fresher", "full stack developer fresher", "python developer fresher", "java developer fresher", "data engineer fresher", "machine learning engineer fresher", "software engineer intern", "frontend developer fresher", "web developer fresher", "devops engineer fresher", "cloud engineer fresher", "junior software engineer", "software engineer trainee", "sde intern", "ai engineer fresher"]
  sites:
    naukri: {first_pass: true, budget: 60, jitter_seconds: [1, 4]}
    indeed: {first_pass: true, budget: 60, jitter_seconds: [2, 6]}
    linkedin: {slow: true, budget: 40, jitter_seconds: [6, 15]}
    glassdoor: {slow: true, budget: 30, jitter_seconds: [3, 8]}
  # The slow lane (mine.py --slow, started after the first pass): LinkedIn and Glassdoor rate-limit, so they run a few searches at a
  # time, widely spaced, for the last day only. 20 terms / per_run 3 = every term covered in about 7 batches.
  slow: {per_run: 3, days: 1, jitter_seconds: [20, 45], batches: 8, gap_minutes: 60}
term_report_days: 14

# ---- Phase 7: quality and safety ----
liveness:
  concurrency: 2
  host_delay_seconds: 2
  timeout_seconds: 15
  stale_after_days: 21
  # A final URL whose path is one of these (or has no more than one segment) is a generic listing, not the posting.
  generic_paths: ["/jobs", "/careers", "/careers/", "/jobs/", "/search", "/openings", "/open-positions", "/"]
  gone_markers: ["no longer available", "position has been filled", "job is closed", "no longer accepting", "this job has expired", "page not found"]

# Regexes (case-insensitive) matched against title + description. A hit flags the row, it never drops it.
scam:
  fee_patterns: ["registration\\s+fee", "security\\s+deposit", "refundable\\s+deposit", "training\\s+fee", "pay\\s+(?:rs\\.?|inr|₹)\\s*[\\d,]+", "processing\\s+fee", "kit\\s+charges?", "laptop\\s+deposit"]
  contact_patterns: ["whatsapp\\s+(?:me|us|only|on|at|\\+?\\d)", "contact\\s+(?:only\\s+)?(?:on|via)\\s+whatsapp", "@(?:gmail|yahoo|outlook|hotmail|rediffmail)\\.com", "telegram\\s+(?:me|us|only)"]
  telegram_sources: ["telegram", "t.me"]
  min_company_chars: 2

jd_hygiene:
  max_chars: 12000

# ---- Phase 8: manual-tab launcher ----
launcher:
  batch: 10
  pause_seconds: 0.4
  weekly_links: tools/weekly_links.txt

# ---- Phase 9: feedback ----
ranker:
  min_labels: 100

# freehire.io is a free third-party API: log what it says, retry once, never crash the run when it is down.
freehire:
  retries: 1
  backoff_seconds: 4
  max_retry_after_seconds: 30

# Phase 7.3: a role on an aggregator counts as confirmed when the company's own board lists a similar title in the same city.
confirm:
  title_overlap: 0.7
  max_companies: 60
  fetch_timeout_seconds: 240

# discover-ats.mjs: a board that answers is not proof it is the company's. With the gate on, a match is written
# to portals.yml only when its owner name, its own website, or data/identity-approved.tsv vouches for it; the
# rest go to data/discovery-review.tsv. Off for a foreign data root (tests, a second profile).
# Override per run with --identity-gate / --no-identity-gate.
discovery:
  identity_gate: true
  # tools/discover-careers.mjs --llm: Groq models (GROQ_API_KEY in .env). The fallback runs when the primary errors, a 429 included.
  llm:
    model: groq:openai/gpt-oss-120b
    fallback: groq:openai/gpt-oss-20b

# The scan steps tools/mine.py runs and the dashboard lists. The one place a step is registered: add an entry here and its
# argument builder in tools/mine.py (STEP_ARGS). windowed: scans "since the last success"; bare_json: the scanner prints its
# receipt on stdout; standalone: runs alone through its own flag (cli) and never as part of a default run; state_id: the key
# its runs are recorded under.
steps:
  - {id: freehire, label: freehire jobs, file: scan-freehire.mjs, windowed: true}
  - {id: internshala, label: Internshala, file: scan-internshala.mjs, windowed: true}
  - {id: jobspy, label: "Naukri and Indeed (LinkedIn and Glassdoor run in the slow lane)", file: scan-jobspy.mjs, windowed: true}
  - {id: portals, label: career pages and job boards in portals.yml, file: scan.mjs, windowed: true, bare_json: true}
  - {id: ats, label: full ATS sweep, file: scan-ats-full.mjs, bare_json: true}
  - {id: slow, label: "LinkedIn and Glassdoor, one small batch (the slow lane)", file: scan-jobspy.mjs, standalone: true, cli: "--slow", state_id: jobspy-slow}
