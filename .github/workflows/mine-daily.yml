# Daily mine.py run on your own machine (self-hosted runner): your data, .env, venv and IP stay local.
# There is no schedule here: cron-job.org calls GitHub's repository_dispatch API once a day (setup: docs/SCHEDULE.md), which
# is more punctual than GitHub's own cron. A run started that way is real. A manual run from the Actions tab is a dry run
# unless you untick the box.
name: mine-daily
on:
  repository_dispatch:
    types: [mine-daily]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (saves nothing, sends no Telegram message)"
        type: boolean
        default: true
concurrency:
  group: mine
  cancel-in-progress: false
permissions: {}
jobs:
  mine:
    runs-on: self-hosted
    timeout-minutes: 300
    defaults:
      run:
        working-directory: ${{ vars.CAREER_OPS_DIR }}
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin
      CAREER_OPS_ROOT: ${{ vars.CAREER_OPS_DIR }}
    steps:
      - name: mine.py
        # The whole script, every time: feeders, all scan steps, the Telegram ping, then the background slow lane for
        # LinkedIn and Glassdoor. Scheduled runs are real; a manual run is a dry run unless you untick the box.
        # An empty RUNNER_TRACKING_ID stops the runner from killing the slow lane when this job ends.
        env:
          RUNNER_TRACKING_ID: ""
        run: tools/.venv-jobspy/bin/python tools/mine.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
