# LinkedIn and Glassdoor rate-limit, so they run as small batches (mine.py --slow: 3 searches per site, last day only)
# spread through the day. 20 search terms are covered in about 7 batches. Cron is UTC: every 3 hours from 04:15.
name: slow-lane
on:
  schedule:
    - cron: "15 4,7,10,13,16,19,22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (saves nothing, sends no Telegram message)"
        type: boolean
        default: true
concurrency:
  group: slow-lane
  cancel-in-progress: false
permissions: {}
jobs:
  batch:
    runs-on: self-hosted
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ vars.CAREER_OPS_DIR }}
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin
      CAREER_OPS_ROOT: ${{ vars.CAREER_OPS_DIR }}
    steps:
      - name: mine.py --slow
        run: tools/.venv-jobspy/bin/python tools/mine.py --slow ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
