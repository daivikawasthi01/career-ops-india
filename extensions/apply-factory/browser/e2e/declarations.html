<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Backend Engineer at Acme</title>
<style>.opts{list-style:none;padding:0;border:1px solid #999;margin:0;max-width:24rem}.opts li{padding:4px 8px}</style></head>
<body><main>
<h1>Backend Engineer, Acme</h1>
<form onsubmit="return false">
  <div><label for="fn">First Name</label><input id="fn" type="text"></div>
  <div><label for="em">Email</label><input id="em" type="email"></div>

  <h2>Voluntary self-identification</h2>
  <ul id="bullets">
    <li><input type="checkbox" id="v1"> I am not a protected veteran</li>
    <li><input type="checkbox" id="v2"> I am a protected veteran</li>
    <li><input type="checkbox" id="a1"> I am legally authorized to work in India</li>
  </ul>
  <ul id="custom">
    <li role="checkbox" aria-checked="false" tabindex="0" id="d1">No, I do not have a disability</li>
    <li role="checkbox" aria-checked="false" tabindex="0" id="d2">Yes, I have a disability</li>
  </ul>
  <fieldset><legend>Self-identification (voluntary)</legend>
    <label><input type="radio" name="dis" id="r1"> Yes, I have a disability</label>
    <label><input type="radio" name="dis" id="r2"> No, I do not have a disability</label>
    <label><input type="radio" name="dis" id="r3"> I do not want to answer</label>
  </fieldset>

  <div><label for="clg">College</label>
    <input id="clg" role="combobox" aria-controls="lb1" aria-autocomplete="list" autocomplete="off">
    <ul id="lb1" class="opts" role="listbox" hidden></ul></div>
  <div><label for="deg">Degree</label>
    <input id="deg" role="combobox" aria-controls="lb2" aria-autocomplete="list" autocomplete="off">
    <ul id="lb2" class="opts" role="listbox" hidden></ul>
    <div id="otherbox" hidden><label for="od">Please specify</label><input id="od" type="text"></div></div>
</form>
<script>
  for (const li of document.querySelectorAll('#custom [role=checkbox]')) li.addEventListener('click', () => li.setAttribute('aria-checked', li.getAttribute('aria-checked') === 'true' ? 'false' : 'true'));
  // A search that answers a second after you type, like many college and employer pickers.
  function searchBox(inputId, listId, all, onPick) {
    const input = document.getElementById(inputId), list = document.getElementById(listId);
    let timer;
    const show = (items) => { list.innerHTML = ''; for (const t of items) { const li = document.createElement('li'); li.setAttribute('role', 'option'); li.textContent = t; li.addEventListener('click', () => { input.value = t; list.hidden = true; onPick(t); }); list.append(li); } list.hidden = false; };
    input.addEventListener('input', () => {
      clearTimeout(timer);
      show(['Searching...']);
      timer = setTimeout(() => { const q = input.value.toLowerCase(); const hits = all.filter((t) => t.toLowerCase().includes(q) && t !== 'Other'); show(hits.length ? [...hits, 'Other'] : ['No results found', 'Other']); }, 1200);
    });
    input.addEventListener('mousedown', () => { if (!input.value) show(['Type to search']); });
  }
  searchBox('clg', 'lb1', ['Delhi Technological University', 'Netaji Subhas Institute of Technology (NSIT)', 'Indian Institute of Technology Delhi', 'Other'], () => {});
  searchBox('deg', 'lb2', ['B.E.', 'M.Sc.', 'MBA', 'Other'], (t) => { document.getElementById('otherbox').hidden = t !== 'Other'; });
</script>
</main></body></html>
