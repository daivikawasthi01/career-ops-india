paths:
  # Local to apply-factory
  kb_db: "kb.sqlite"

  # Career-ops files (relative to this config, i.e. from extensions/apply-factory/)
  profile: "../../config/profile.yml"
  reports_dir: "../../reports"
  output_dir: "../../output"
  pipeline_tsv: "../../data/pipeline.tsv"
  jobs_db: "../../data/jobs.db"            # written by tools/mine.py; the extension only reads it
  careers_discovery: "../../data/careers-discovery.tsv"   # company -> website domain, found by discover-careers.mjs
  careers_directory: "../../data/careers-directory.tsv"
  connections: "../../data/Connections.csv"                # your LinkedIn export; optional, read by linkedin-join.mjs
  contacts_tsv: "../../data/contacts.tsv"                  # career-ops contact list; cold emails are noted here with a follow-up date

# Jobs tab: which jobs fit your level. Your years come from config/profile.yml (candidate.years_of_experience).
jobs:
  stretch_years: 2      # a job fits when the years it asks for are at most your years plus this (the scanner's seniority_guard drops from 3 years)
  # A title with one of these is above entry level. (Roman and numeric levels such as "Engineer II" or "SDE 3" are matched in lib/jobs.py.)
  seniority_words: [senior, sr, lead, staff, principal, manager, director, head, vp, architect, distinguished, fellow, "team lead", "tech lead"]
  entry_words: [intern, internship, graduate, fresher, freshers, junior, jr, trainee, entry, apprentice, associate, "new grad", campus, "sde 1", "sde-1", "sde i"]
  auto_remove: false    # true: when the years check ends, delete the jobs that clearly ask for more years from jobs.db (backup first; see lib/jobs_prune.py). Off by default: the Jobs tab only hides them
  years_batch: 150      # postings read per round by the background years check

llm:
  # Nothing runs on this Mac. Every call goes to the hosted models first; when none can answer in time, `claude -p` (your Claude plan) does.
  backend: "claude"
  temperature: 0.1
  cloud:
    enabled: true
    providers: [groq, gemini]   # keys are rotated; a rate-limited key rests, then claude -p answers
    budget_seconds: 50    # all hosted attempts for one call together; then claude -p answers
    attempt_seconds: 35   # one hosted attempt
    keys: {}   # empty: every key found in .env is used (GROQ_API_KEY, GROQ_API_KEY_2 ...). To keep some for the scanners, list numbers here: {groq: [2, 3]}
    groq_model: "openai/gpt-oss-120b"
    search_models: ["openai/gpt-oss-20b", "openai/gpt-oss-120b"]   # Groq browser search, about 17k tokens a query; each model has its own daily allowance
    search_providers: [groq, gemini, claude]   # web search order (Company tab); claude -p (haiku) is the last resort
    gemini_model: ["gemini-3.5-flash", "gemini-flash-latest", "gemini-3.1-flash-lite"]   # each has its own limit; the next runs when one is limited
  claude:
    model: "haiku"         # haiku only: claude -p is the fallback, so it stays small and fast

server:
  host: "127.0.0.1"
  port: 8765

# Anonymous usage report, counts only, sent once a day. url is the receiving address, set once here so every install has it (tools/share-receiver.gs
# is a Google Apps Script that logs reports to a Sheet). With url empty nothing is sent. A person can turn it off with share: {enabled: false} in config.local.yaml.
share:
  url: "https://script.google.com/macros/s/AKfycbzClx_EXKvPK3JTiVLSKkEoVGh-9w7irdvnWMcgzT-VFTFP3JVLP1EqYk_w77JyV4_l/exec"
  enabled: true

paths_extra:
  facts: "facts.yml"
  cv: "../../cv.md"
  cv_tex: "data/cv-tex"

# Which PDF is attached, chosen by the role. Add a key here and a matching entry in rules/rules.json resume_roles.
resumes:
  default: "../../output/resumes/Resume.pdf"
  devops: "../../output/resumes/Resume-DevOps.pdf"   # until a role CV exists, that role uses the default CV
  ai: "../../output/resumes/Resume-AI.pdf"

# Company tab. Search goes Groq, Gemini, then claude -p (llm.cloud.search_providers).
company:
  cache_days: 14
  people_queries: 6     # at most this many searches for people: the hiring team for the job, HR per city, then each role for the size
  people_parallel: 3    # people searches run this many at a time
  home_region: ""       # people based here are searched for and listed first; set by the setup wizard (your country)
  people_target: 8      # stop searching once this many people have a source page
  default_locations: []   # HR and recruiters are searched in each when the job names no city; set by the setup wizard
  email_domains: 3      # work-email domains to try (the web's answer, the website, then initials and name guesses that have a mail server)
  pages: ["/", "/contact", "/contact-us", "/about", "/about-us", "/team", "/leadership", "/careers"]   # public pages read for emails and phones, robots.txt permitting
  # Job boards and ATS hosts: a job link on one of these says nothing about the company's own domain.
  not_company_hosts: [greenhouse.io, lever.co, ashbyhq.com, myworkdayjobs.com, workday.com, smartrecruiters.com, icims.com, linkedin.com, naukri.com,
                      indeed.com, glassdoor.com, wellfound.com, instahyre.com, cutshort.in, internshala.com, bamboohr.com, jobvite.com, recruitee.com,
                      keka.com, zohorecruit.com, freshteam.com, google.com, unstop.com, foundit.in, monster.com, apna.co]
  bands: [{name: startup, max: 50}, {name: small, max: 250}, {name: mid, max: 2500}, {name: large, max: 100000000}]
  # Who to look for by company size. The job's own title is added so the team that would hire for it comes first.
  roles:
    startup: ["founder or co-founder", "CTO or head of engineering", "head of people or talent, if any"]
    small: ["CTO or VP engineering", "engineering manager for the team hiring", "head of talent or HR"]
    mid: ["head of the department hiring", "engineering manager for the team hiring", "talent acquisition lead", "technical recruiter"]
    large: ["technical recruiter or campus recruiter for engineering", "HR business partner for the engineering org", "director of the team hiring"]

mail:
  max_probes: 14        # RCPT checks per call, control address included
  delay_seconds: 1.2    # between checks in one SMTP session
  timeout: 12
  helo: ""              # blank = this Mac's host name
  cache_days: 7
  generic: [careers, jobs, hr, talent, recruiting, recruitment, hiring, people, hello, contact, info]
